// =====================================================
// USART0 initialisieren
// =====================================================

void USART0_Init(void)
{
	// Baudrate einstellen
	UBRR0H = (uint8_t)(UBRR_VALUE >> 8);
	UBRR0L = (uint8_t)UBRR_VALUE;

	// Normaler USART-Betrieb
	UCSR0A = 0;

	// RX und TX einschalten
	// RX Interrupt einschalten
	UCSR0B =
	(1 << RXEN0) |
	(1 << TXEN0) |
	(1 << RXCIE0);

	// 8 Datenbits
	// 1 Stopbit
	// keine Parität
	UCSR0C =
	(1 << UCSZ01) |
	(1 << UCSZ00);
}

// =====================================================
// Ein Zeichen senden
// =====================================================

void USART0_SendChar(char zeichen)
{
	// Warten bis Senderegister frei ist
	while (!(UCSR0A & (1 << UDRE0)))
	{
	}

	// Zeichen senden
	UDR0 = zeichen;
}

// =====================================================
// Einen String senden
// =====================================================

void USART0_SendString(const char *string)
{
	while (*string != '\0')
	{
		USART0_SendChar(*string);

		string++;
	}
}

// =====================================================
// USART0 RX Interrupt
// =====================================================

ISR(USART0_RX_vect)
{
	char zeichen;

	// Empfangenes Zeichen auslesen
	zeichen = UDR0;

	// Letztes empfangenes Zeichen speichern
	letztes_zeichen = zeichen;

	// ENTER empfangen?
	if (zeichen == '\r' || zeichen == '\n')
	{
		// String abschließen
		empfangsstring[index] = '\0';

		// Hauptprogramm informieren
		string_fertig = 1;

		// Index zurücksetzen
		index = 0;
	}

	// Normales Zeichen
	else
	{
		if (index < BUFFER_SIZE - 1)
		{
			empfangsstring[index] = zeichen;

			index++;
		}
		else
		{
			// Puffer ist voll
			empfangsstring[index] = '\0';

			string_fertig = 1;

			index = 0;
		}
	}
}



void lcd_daten(uint8_t data){
	Lcd_ctrl |= (1<<rs);
	Lcd_ctrl &= ~(1<<wr);
	Lcd_data = data;
	_delay_us(8);
	Lcd_ctrl &=  ~(1<<en);
	_delay_us(8);
	Lcd_ctrl |=(1<<en);
	_delay_us(8);
}
void pulse(void){
	_delay_us(8);
	Lcd_ctrl |=(1<<en);
	_delay_us(8);
	Lcd_ctrl &= ~(1<<en);
}
void lcd_command(uint8_t cmd){
	Lcd_ctrl &= ~(1<<rs);
	Lcd_ctrl &= ~(1<<wr);
	Lcd_data = cmd;
	pulse();
}
void lcd_init(){
	_delay_ms(30);
	Lcd_ctrl |= (1<<cs1);
	lcd_command(0x30);
	Lcd_ctrl |= (1<<cs2);
	lcd_command(0x30);
	Lcd_ctrl |= (1<<cs1);
	lcd_command(0xC0);
	Lcd_ctrl |= (1<<cs2);
	lcd_command(0xC0);
}




void selectchip(uint8_t x){
	if(x<64){
		Lcd_ctrl |= (1<<cs1);
		Lcd_ctrl &= ~(1<<cs2);
	}
	else
	{
		Lcd_ctrl |= (1<<cs2);
		Lcd_ctrl &= ~(1<<cs1);
	}
}
void writecomand(uint8_t cmd,uint8_t chip){
	if(chip == 0){
		Lcd_ctrl |= (1<<cs1);
		Lcd_ctrl &= ~(1<<cs2);
	}
	else{
		Lcd_ctrl |= (1<<cs2);
		Lcd_ctrl &= ~(1<<cs1);
	}
	Lcd_ctrl &= ~(1<<rs);
	Lcd_ctrl &= ~(1<<wr);
	Lcd_data=cmd;
	pulse();
}
void writedata(uint8_t data,uint8_t chip){
	if(chip == 0){
		Lcd_ctrl |= (1<<cs1);
		Lcd_ctrl &= ~(1<<cs2);
	}
	else{
		Lcd_ctrl |= (1<<cs2);
		Lcd_ctrl &= ~(1<<cs1);
	}
	Lcd_ctrl |= (1<<rs);
	Lcd_ctrl &= ~(1<<wr);
	Lcd_data = data;
	pulse();
}
void setpage(uint8_t page,uint8_t chip){
	writecomand(0xB8|page,chip);
}
void setcolum(uint8_t col,uint8_t chip){
	writecomand(0x40|col,chip);
}
void lcd(const uint8_t *bmp){
	uint16_t index=0;
	
	for(uint8_t page=0;page<8;page++){
		setpage(page,0);
		setcolum(0,0);
		for(uint8_t x=0;x<64;x++){
			writedata(pgm_read_byte(&bmp[index++]),0);
		}
		setpage(page,1);
		setcolum(0,1);
		for(uint8_t x=0;x<64;x++){
			writedata(pgm_read_byte(&bmp[index++]),1);
		}
	}
}
